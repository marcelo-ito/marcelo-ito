# Gera a animação da cobrinha comendo o gráfico de contribuições.
# Os SVGs vão para o branch "output", que o README referencia.
name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 00h (horário de Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#a06a37&color_dots=#ebedf0,#f3e3c3,#e3c08f,#c99560,#a06a37
            dist/snake-dark.svg?palette=github-dark&color_snake=#d4a373&color_dots=#161b22,#3a2e22,#6b5132,#a37a4a,#d4a373

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
